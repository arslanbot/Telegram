<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Мессенджер</title>
    <style>
        body { background-color: #0e1621; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background-color: #17212b; padding: 30px; border-radius: 16px; width: 90%; max-width: 350px; text-align: center; }
        h2 { margin-bottom: 20px; color: #5ca8e1; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 8px; background-color: #242f3d; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; background-color: #5ca8e1; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #4a8cc4; }
        #msg { color: #ff4444; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>
<div class="box">
    <h2>Мой Мессенджер</h2>
    <input type="text" id="username" placeholder="Логин">
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="register()">Регистрация</button>
    <button onclick="login()">Вход</button>
    <p id="msg"></p>
</div>

<script>
    async function register() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        if(!username || !password) { document.getElementById('msg').innerText = "Заполните все поля"; return; }
        
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        document.getElementById('msg').innerText = data.message || data.detail;
    }

    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        if(!username || !password) { document.getElementById('msg').innerText = "Заполните все поля"; return; }

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (data.status === 'ok') {
            localStorage.setItem('user_id', data.user_id);
            localStorage.setItem('username', data.username);
            window.location.href = '/static/chat.html';
        } else {
            document.getElementById('msg').innerText = data.detail;
        }
    }
</script>
</body>
</html>
