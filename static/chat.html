<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат</title>
    <style>
        body { background-color: #0e1621; color: #fff; font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 300px; background-color: #17212b; border-right: 1px solid #101921; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-size: 20px; font-weight: bold; border-bottom: 1px solid #101921; color: #5ca8e1; }
        .users-list { flex: 1; overflow-y: auto; }
        .user-item { padding: 15px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; border-bottom: 1px solid #101921; }
        .user-item:hover { background-color: #242f3d; }
        .avatar { width: 40px; height: 40px; background-color: #2b5278; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #0e1621; }
        .chat-header { padding: 20px; font-size: 18px; border-bottom: 1px solid #101921; background-color: #17212b; font-weight: bold; display: none; }
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 70%; padding: 10px 15px; border-radius: 12px; font-size: 15px; }
        .message.my { background-color: #2b5278; align-self: flex-end; }
        .message.other { background-color: #182533; align-self: flex-start; }
        .input-area { padding: 15px; display: flex; gap: 10px; background-color: #17212b; border-top: 1px solid #101921; }
        .input-area input { flex: 1; padding: 12px; border: none; border-radius: 20px; background-color: #242f3d; color: #fff; outline: none; }
        .input-area button { padding: 12px 20px; border: none; border-radius: 20px; background-color: #5ca8e1; color: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">Чаты</div>
        <div class="users-list" id="usersList"></div>
    </div>
    <div class="chat-area">
        <div class="chat-header" id="chatHeader">Выберите чат</div>
        <div class="messages" id="messagesArea"></div>
        <div class="input-area" id="inputArea" style="display: none;">
            <input type="text" id="messageInput" placeholder="Сообщение..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

<script>
    const myId = parseInt(localStorage.getItem('user_id'));
    const myName = localStorage.getItem('username');
    if (!myId) window.location.href = '/static/index.html';

    let currentChatId = null;
    let ws = null;

    // Загрузка пользователей
    async function loadUsers() {
        const res = await fetch(`/api/users/${myId}`);
        const users = await res.json();
        const list = document.getElementById('usersList');
        list.innerHTML = '';
        users.forEach(u => {
            const div = document.createElement('div');
            div.className = 'user-item';
            div.innerHTML = `<div class="avatar">${u.avatar || u.username[0].toUpperCase()}</div><span>${u.username}</span>`;
            div.onclick = () => openChat(u.id, u.username);
            list.appendChild(div);
        });
    }

    // Подключение WebSocket
    function connectWS() {
        ws = new WebSocket(`wss://${window.location.host}/ws/${myId}`);
        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.sender_id === currentChatId) {
                appendMessage(msg.text, 'other');
            }
        };
    }

    // Открытие чата
    async function openChat(userId, username) {
        currentChatId = userId;
        document.getElementById('chatHeader').style.display = 'block';
        document.getElementById('chatHeader').innerText = username;
        document.getElementById('inputArea').style.display = 'flex';
        document.getElementById('messagesArea').innerHTML = '';
        
        // Загрузка истории
        const res = await fetch(`/api/messages/${myId}/${userId}`);
        const msgs = await res.json();
        msgs.forEach(m => {
            const type = m.sender_id === myId ? 'my' : 'other';
            appendMessage(m.text, type);
        });
    }

    function appendMessage(text, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.innerText = text;
        const area = document.getElementById('messagesArea');
        area.appendChild(div);
        area.scrollTop = area.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text || !currentChatId) return;
        
        ws.send(JSON.stringify({ sender_id: myId, receiver_id: currentChatId, text: text }));
        appendMessage(text, 'my');
        input.value = '';
    }

    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    // Запуск
    loadUsers();
    connectWS();
</script>
</body>
</html>
